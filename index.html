<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐻 Bear Hunt Calculator – Kingshot</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2330; --border:#2a3441;
    --accent:#4a9eff; --leader:#f0a030; --joiner:#7b6fff;
    --inf:#4fc3f7; --cav:#81c784; --arc:#ffb74d;
    --text:#e6edf3; --muted:#7d8590; --success:#56d364; --warn:#f0883e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;min-height:100vh;padding:20px 16px 40px;
    background-image:radial-gradient(ellipse at 20% 10%,rgba(74,158,255,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(255,107,53,.05) 0%,transparent 50%);}
  header{text-align:center;margin-bottom:20px;padding-top:8px;}
  header .icon{font-size:2.5rem;display:block;margin-bottom:4px;filter:drop-shadow(0 0 12px rgba(255,107,53,.6));}
  header h1{font-family:'Rajdhani',sans-serif;font-size:1.8rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    background:linear-gradient(135deg,#ff8c42,#ff6b35,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  header p{color:var(--muted);font-size:.8rem;letter-spacing:1px;text-transform:uppercase;margin-top:4px;}
  header .by{margin-top:6px;font-size:.72rem;color:#3d5068;letter-spacing:2px;font-family:'Rajdhani',sans-serif;font-weight:600;}

  /* Lang toggle */
  .lang-toggle{display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px;}
  .lang-btn{padding:4px 11px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);
    font-family:'Rajdhani',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s;}
  .lang-btn.active{background:rgba(74,158,255,.12);border-color:var(--accent);color:var(--accent);}

  /* Mode toggle */
  .mode-toggle{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:16px;gap:4px;}
  .mode-btn{flex:1;padding:9px 8px;border-radius:7px;border:none;background:transparent;color:var(--muted);
    font-family:'Rajdhani',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
  .mode-btn.active-leader{background:rgba(240,160,48,.15);color:var(--leader);box-shadow:0 0 0 1px rgba(240,160,48,.4);}
  .mode-btn.active-joiner{background:rgba(123,111,255,.15);color:var(--joiner);box-shadow:0 0 0 1px rgba(123,111,255,.4);}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:12px 12px 0 0;}
  .card.troops::before{background:linear-gradient(90deg,var(--inf),var(--cav),var(--arc));}
  .card.leader::before{background:linear-gradient(90deg,var(--leader),#ffdd70);}
  .card.joiner::before{background:linear-gradient(90deg,var(--joiner),#a89fff);}
  .card.result-leader::before{background:linear-gradient(90deg,var(--leader),var(--success));}
  .card.result-joiner::before{background:linear-gradient(90deg,var(--joiner),var(--success));}

  .card-title{font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .card-title .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .role-tag{font-family:'Rajdhani',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    padding:2px 8px;border-radius:20px;margin-left:auto;}
  .role-tag.leader{background:rgba(240,160,48,.15);color:var(--leader);border:1px solid rgba(240,160,48,.3);}
  .role-tag.joiner{background:rgba(123,111,255,.15);color:var(--joiner);border:1px solid rgba(123,111,255,.3);}

  /* Fields */
  .field{margin-bottom:12px;} .field:last-child{margin-bottom:0;}
  .field label{display:flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
  .badge{display:inline-block;width:10px;height:10px;border-radius:50%;}
  .badge-cap{background:var(--accent);box-shadow:0 0 5px var(--accent);}
  .badge-inf{background:var(--inf);box-shadow:0 0 5px var(--inf);}
  .badge-cav{background:var(--cav);box-shadow:0 0 5px var(--cav);}
  .badge-arc{background:var(--arc);box-shadow:0 0 5px var(--arc);}
  input[type="number"]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);
    font-family:'Exo 2',sans-serif;font-size:1rem;font-weight:600;padding:10px 14px;outline:none;transition:border-color .2s,box-shadow .2s;-moz-appearance:textfield;}
  input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;}
  input[type="number"]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,158,255,.15);}
  input[type="number"][readonly]{opacity:.5;cursor:not-allowed;border-style:dashed;}
  .readonly-hint{font-size:.66rem;color:var(--joiner);font-weight:600;letter-spacing:.5px;margin-left:auto;}

  /* Ratio inputs */
  .ratio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
  .ratio-cell{display:flex;flex-direction:column;gap:5px;}
  .ratio-label{font-size:.72rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
    display:flex;align-items:center;gap:5px;color:var(--muted);}
  .ratio-input-wrap{position:relative;}
  .ratio-input{width:100%;background:var(--surface2);border:2px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1.4rem;font-weight:700;
    padding:8px 28px 8px 10px;outline:none;text-align:center;transition:border-color .2s;
    -moz-appearance:textfield;}
  .ratio-input::-webkit-outer-spin-button,.ratio-input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .ratio-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,158,255,.12);}
  .ratio-input.inf{border-color:rgba(79,195,247,.3);} .ratio-input.inf:focus{border-color:var(--inf);}
  .ratio-input.cav{border-color:rgba(129,199,132,.3);} .ratio-input.cav:focus{border-color:var(--cav);}
  .ratio-input.arc{border-color:rgba(255,183,77,.3);} .ratio-input.arc:focus{border-color:var(--arc);}
  .ratio-pct{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    font-family:'Rajdhani',sans-serif;font-size:.85rem;font-weight:700;color:var(--muted);pointer-events:none;}
  .ratio-bar{height:4px;border-radius:2px;margin-top:3px;transition:width .2s;}
  .ratio-bar.inf{background:var(--inf);}
  .ratio-bar.cav{background:var(--cav);}
  .ratio-bar.arc{background:var(--arc);}
  .ratio-total{display:flex;align-items:center;justify-content:space-between;
    padding:7px 10px;border-radius:6px;background:rgba(255,255,255,.03);
    border-left:2px solid var(--accent);margin-top:4px;}
  .ratio-total-lbl{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.5px;}
  .ratio-total-val{font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;color:var(--text);}
  .ratio-total-val.ok{color:var(--success);}
  .ratio-total-val.over{color:var(--warn);}
  .normalize-hint{font-size:.72rem;color:var(--muted);margin-top:10px;padding:7px 10px;background:rgba(255,255,255,.03);border-radius:6px;border-left:2px solid var(--accent);}

  /* Teams */
  .teams-row{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .teams-row label{font-size:.78rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);flex-shrink:0;}
  .teams-count{display:flex;align-items:center;gap:8px;}
  .btn-teams{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);
    font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:'Rajdhani',sans-serif;font-weight:700;}
  .btn-teams:hover{border-color:var(--accent);background:rgba(74,158,255,.1);color:var(--accent);}
  .teams-val{font-family:'Rajdhani',sans-serif;font-size:1.5rem;font-weight:700;color:var(--accent);min-width:22px;text-align:center;}

  /* Presets */
  .preset-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}
  .preset-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);
    font-family:'Rajdhani',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s;}
  .preset-btn:hover,.preset-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(74,158,255,.08);}

  /* Section divider */
  .section-divider{display:flex;align-items:center;gap:12px;margin:18px 0 14px;}
  .section-divider .sdline{flex:1;height:1px;background:var(--border);}
  .section-divider .sdlabel{font-family:'Rajdhani',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}

  /* Result table */
  .result-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px;}
  .result-table{width:100%;min-width:300px;border-collapse:separate;border-spacing:0;font-size:.85rem;}
  .result-table thead tr th{font-family:'Rajdhani',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    color:var(--muted);padding:7px 8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  .result-table thead tr th:first-child{text-align:left;}
  .result-table thead tr th.col-total{color:var(--text);border-left:1px solid var(--border);}
  .result-table tbody tr{transition:background .15s;}
  .result-table tbody tr:hover{background:rgba(255,255,255,.03);}
  .result-table tbody td{padding:9px 8px;text-align:right;border-bottom:1px solid rgba(42,52,65,.5);font-weight:600;font-size:.9rem;white-space:nowrap;}
  .result-table tbody td:first-child{text-align:left;}
  .result-table tbody td.col-total{border-left:1px solid var(--border);font-family:'Rajdhani',sans-serif;font-size:.98rem;font-weight:700;}
  .type-cell{display:flex;align-items:center;gap:7px;}
  .result-table tfoot td{padding:9px 8px;text-align:right;font-family:'Rajdhani',sans-serif;font-size:.98rem;font-weight:700;border-top:2px solid var(--border);white-space:nowrap;}
  .result-table tfoot td:first-child{text-align:left;color:var(--muted);}
  .result-table tfoot td.col-total{border-left:1px solid var(--border);color:var(--accent);font-size:1.02rem;}
  .val-inf{color:var(--inf);} .val-cav{color:var(--cav);} .val-arc{color:var(--arc);}
  .insufficient{color:var(--warn)!important;} .cell-warn{background:rgba(240,136,62,.07);}

  /* Warning */
  .warning-block{display:none;background:rgba(240,136,62,.08);border:1px solid rgba(240,136,62,.3);border-radius:8px;padding:10px 13px;margin-top:12px;font-size:.81rem;color:var(--warn);line-height:1.5;}
  .warning-block.show{display:block;}

  /* Pool */
  .pool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px;}
  .pool-cell{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 7px;text-align:center;}
  .pool-cell .pool-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;margin-bottom:4px;}
  .pool-cell .pool-val{font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:700;}

  .sep{border-bottom:1px solid var(--border);margin:12px 0;}
  .leader-section.hidden{display:none;}
  .btn-reset{display:block;width:100%;padding:10px;margin-top:8px;background:transparent;border:1px dashed var(--border);border-radius:8px;
    color:var(--muted);font-family:'Exo 2',sans-serif;font-size:.8rem;cursor:pointer;transition:all .2s;letter-spacing:.5px;}
  .btn-reset:hover{border-color:var(--warn);color:var(--warn);}
</style>
</head>
<body>

<header>
  <span class="icon">🐻</span>
  <h1>Bear Hunt Calculator</h1>
  <p data-i18n="subtitle"></p>
  <p class="by">by Errab</p>
</header>

<div class="lang-toggle">
  <button class="lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
  <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
  <button class="lang-btn" onclick="setLang('es')">🇪🇸 ES</button>
</div>

<div class="mode-toggle">
  <button class="mode-btn active-leader" id="btn-mode-leader" onclick="setMode('leader')" data-i18n="modeLeader"></button>
  <button class="mode-btn" id="btn-mode-joiner" onclick="setMode('joiner')" data-i18n="modeJoiner"></button>
</div>

<!-- STOCK -->
<div class="card troops">
  <div class="card-title"><div class="dot"></div> <span data-i18n="myTroops"></span></div>
  <div class="field">
    <label><span class="badge badge-inf"></span> <span data-i18n="totalInf"></span></label>
    <input type="number" id="inf" min="0" oninput="calcAll()">
  </div>
  <div class="field">
    <label><span class="badge badge-cav"></span> <span data-i18n="totalCav"></span></label>
    <input type="number" id="cav" min="0" oninput="calcAll()">
  </div>
  <div class="field">
    <label><span class="badge badge-arc"></span> <span data-i18n="totalArc"></span></label>
    <input type="number" id="arc" min="0" oninput="calcAll()">
  </div>
</div>

<!-- LEADER SECTION -->
<div class="leader-section" id="leader-section">
  <div class="section-divider"><div class="sdline"></div><div class="sdlabel" data-i18n="divLeader"></div><div class="sdline"></div></div>

  <div class="card leader">
    <div class="card-title">
      <div class="dot" style="background:var(--leader);box-shadow:0 0 6px var(--leader)"></div>
      <span data-i18n="squadLeader"></span>
      <span class="role-tag leader" data-i18n="roleLeader"></span>
    </div>
    <div class="field">
      <label><span class="badge badge-cap"></span> <span data-i18n="squadCap"></span></label>
      <input type="number" id="cap-l" min="0" oninput="calcAll()">
    </div>
    <div class="ratio-grid" style="margin-top:14px;">
      <div class="ratio-cell">
        <div class="ratio-label"><span class="badge badge-inf"></span> <span data-i18n="inf"></span></div>
        <div class="ratio-input-wrap">
          <input type="number" class="ratio-input inf" id="l-pct-inf" min="0" max="100" value="10" oninput="onRatio('l')">
          <span class="ratio-pct">%</span>
        </div>
        <div class="ratio-bar inf" id="l-bar-inf" style="width:10%"></div>
      </div>
      <div class="ratio-cell">
        <div class="ratio-label"><span class="badge badge-cav"></span> <span data-i18n="cav"></span></div>
        <div class="ratio-input-wrap">
          <input type="number" class="ratio-input cav" id="l-pct-cav" min="0" max="100" value="10" oninput="onRatio('l')">
          <span class="ratio-pct">%</span>
        </div>
        <div class="ratio-bar cav" id="l-bar-cav" style="width:10%"></div>
      </div>
      <div class="ratio-cell">
        <div class="ratio-label"><span class="badge badge-arc"></span> <span data-i18n="arc"></span></div>
        <div class="ratio-input-wrap">
          <input type="number" class="ratio-input arc" id="l-pct-arc" min="0" max="100" value="80" oninput="onRatio('l')">
          <span class="ratio-pct">%</span>
        </div>
        <div class="ratio-bar arc" id="l-bar-arc" style="width:80%"></div>
      </div>
    </div>
    <div class="ratio-total" id="l-ratio-total">
      <span class="ratio-total-lbl" data-i18n="totalRatio"></span>
      <span class="ratio-total-val ok" id="l-ratio-val">100%</span>
    </div>
    <div class="preset-btns">
      <button class="preset-btn" onclick="setPreset('l',10,30,60)">10/30/60</button>
      <button class="preset-btn" onclick="setPreset('l',10,20,70)">10/20/70</button>
      <button class="preset-btn active" onclick="setPreset('l',10,10,80)">10/10/80</button>
      <button class="preset-btn" onclick="setPreset('l',1,10,89)">1/10/89</button>
    </div>
  </div>

  <div class="card result-leader">
    <div class="card-title">
      <div class="dot" style="background:var(--leader);box-shadow:0 0 6px var(--leader)"></div>
      <span data-i18n="resLeader"></span>
      <span class="role-tag leader" data-i18n="roleLeader"></span>
    </div>
    <div class="result-wrap">
      <table class="result-table">
        <thead id="l-thead"><tr><th data-i18n="typeCol"></th><th class="col-total" data-i18n="totalCol"></th></tr></thead>
        <tbody id="l-tbody"></tbody>
        <tfoot id="l-tfoot"></tfoot>
      </table>
    </div>
    <div class="warning-block" id="l-warning-block">⚠️ <strong data-i18n="insuff"></strong><br><span id="l-warning-msg"></span></div>
    <div class="sep"></div>
    <div class="card-title" style="margin-bottom:9px;font-size:.85rem;">
      <div class="dot" style="background:var(--muted);box-shadow:none"></div>
      <span data-i18n="remainLeader"></span>
    </div>
    <div class="pool-grid">
      <div class="pool-cell"><div class="pool-label" data-i18n="inf"></div><div class="pool-val val-inf" id="l-u-inf">—</div></div>
      <div class="pool-cell"><div class="pool-label" data-i18n="cav"></div><div class="pool-val val-cav" id="l-u-cav">—</div></div>
      <div class="pool-cell"><div class="pool-label" data-i18n="arc"></div><div class="pool-val val-arc" id="l-u-arc">—</div></div>
    </div>
  </div>
</div><!-- end leader-section -->

<!-- JOINER SECTION -->
<div class="section-divider"><div class="sdline"></div><div class="sdlabel" data-i18n="divJoiner"></div><div class="sdline"></div></div>

<div class="card joiner">
  <div class="card-title">
    <div class="dot" style="background:var(--joiner);box-shadow:0 0 6px var(--joiner)"></div>
    <span data-i18n="squadJoiner"></span>
    <span class="role-tag joiner" data-i18n="roleJoiner"></span>
  </div>
  <div class="field">
    <label><span class="badge badge-cap" style="background:var(--joiner);box-shadow:0 0 5px var(--joiner)"></span> <span data-i18n="squadCap"></span></label>
    <input type="number" id="cap-j" min="0" oninput="calcAll()">
  </div>
  <div class="field">
    <label><span class="badge badge-inf"></span> <span data-i18n="availInf"></span> <span class="readonly-hint" data-i18n="autoHint"></span></label>
    <input type="number" id="j-inf-disp" readonly placeholder="—">
  </div>
  <div class="field">
    <label><span class="badge badge-cav"></span> <span data-i18n="availCav"></span> <span class="readonly-hint" data-i18n="autoHint"></span></label>
    <input type="number" id="j-cav-disp" readonly placeholder="—">
  </div>
  <div class="field">
    <label><span class="badge badge-arc"></span> <span data-i18n="availArc"></span> <span class="readonly-hint" data-i18n="autoHint"></span></label>
    <input type="number" id="j-arc-disp" readonly placeholder="—">
  </div>
  <div class="ratio-grid" style="margin-top:14px;">
    <div class="ratio-cell">
      <div class="ratio-label"><span class="badge badge-inf"></span> <span data-i18n="inf"></span></div>
      <div class="ratio-input-wrap">
        <input type="number" class="ratio-input inf" id="j-pct-inf" min="0" max="100" value="10" oninput="onRatio('j')">
        <span class="ratio-pct">%</span>
      </div>
      <div class="ratio-bar inf" id="j-bar-inf" style="width:10%"></div>
    </div>
    <div class="ratio-cell">
      <div class="ratio-label"><span class="badge badge-cav"></span> <span data-i18n="cav"></span></div>
      <div class="ratio-input-wrap">
        <input type="number" class="ratio-input cav" id="j-pct-cav" min="0" max="100" value="10" oninput="onRatio('j')">
        <span class="ratio-pct">%</span>
      </div>
      <div class="ratio-bar cav" id="j-bar-cav" style="width:10%"></div>
    </div>
    <div class="ratio-cell">
      <div class="ratio-label"><span class="badge badge-arc"></span> <span data-i18n="arc"></span></div>
      <div class="ratio-input-wrap">
        <input type="number" class="ratio-input arc" id="j-pct-arc" min="0" max="100" value="80" oninput="onRatio('j')">
        <span class="ratio-pct">%</span>
      </div>
      <div class="ratio-bar arc" id="j-bar-arc" style="width:80%"></div>
    </div>
  </div>
  <div class="ratio-total" id="j-ratio-total">
    <span class="ratio-total-lbl" data-i18n="totalRatio"></span>
    <span class="ratio-total-val ok" id="j-ratio-val">100%</span>
  </div>
  <div class="preset-btns">
    <button class="preset-btn" onclick="setPreset('j',10,30,60)">10/30/60</button>
    <button class="preset-btn" onclick="setPreset('j',10,20,70)">10/20/70</button>
    <button class="preset-btn active" onclick="setPreset('j',10,10,80)">10/10/80</button>
    <button class="preset-btn" onclick="setPreset('j',1,10,89)">1/10/89</button>
  </div>
  <div class="teams-row">
    <label data-i18n="squads"></label>
    <div class="teams-count">
      <button class="btn-teams" onclick="changeTeams(-1)">−</button>
      <div class="teams-val" id="j-teams-val" style="color:var(--joiner)">1</div>
      <button class="btn-teams" onclick="changeTeams(1)">+</button>
    </div>
  </div>
</div>

<div class="card result-joiner">
  <div class="card-title">
    <div class="dot" style="background:var(--joiner);box-shadow:0 0 6px var(--joiner)"></div>
    <span data-i18n="resJoiner"></span>
    <span class="role-tag joiner" data-i18n="roleJoiner"></span>
  </div>
  <div class="result-wrap">
    <table class="result-table">
      <thead id="j-thead"><tr><th data-i18n="typeCol"></th><th class="col-total" data-i18n="totalCol"></th></tr></thead>
      <tbody id="j-tbody"></tbody>
      <tfoot id="j-tfoot"></tfoot>
    </table>
  </div>
  <div class="warning-block" id="j-warning-block">⚠️ <strong data-i18n="insuff"></strong><br><span id="j-warning-msg"></span></div>
  <div class="sep"></div>
  <div class="card-title" style="margin-bottom:9px;font-size:.85rem;">
    <div class="dot" style="background:var(--muted);box-shadow:none"></div>
    <span data-i18n="remainJoiner"></span>
  </div>
  <div class="pool-grid">
    <div class="pool-cell"><div class="pool-label" data-i18n="inf"></div><div class="pool-val val-inf" id="j-u-inf">—</div></div>
    <div class="pool-cell"><div class="pool-label" data-i18n="cav"></div><div class="pool-val val-cav" id="j-u-cav">—</div></div>
    <div class="pool-cell"><div class="pool-label" data-i18n="arc"></div><div class="pool-val val-arc" id="j-u-arc">—</div></div>
  </div>
</div>

<button class="btn-reset" onclick="resetAll()"><span data-i18n="reset"></span></button>

<script>
// ── i18n ──
const T = {
  fr: {
    subtitle:'Kingshot · Composition des Escouades',
    modeLeader:'⚔️ Rallyes Leader', modeJoiner:'🛡️ Joiner Uniquement',
    divLeader:'⚔️ Configuration Leader', divJoiner:'🛡️ Configuration Joiner',
    myTroops:'Mes Troupes Disponibles',
    totalInf:'Infanterie Totale', totalCav:'Cavalerie Totale', totalArc:'Archers Totaux',
    squadLeader:'Escouade Leader', squadJoiner:'Escouade Joiner',
    squadCap:"Capacité de l'escouade",
    inf:'Infanterie', cav:'Cavalerie', arc:'Archers',
    normOk:'✓ Ratios normalisés à 100%',
    squads:'Escouades',
    resLeader:'Résultats Leader', resJoiner:'Résultats Joiner',
    remainLeader:'Restant après Leader', remainJoiner:'Restant total (non utilisé)',
    availInf:'Infanterie disponible', availCav:'Cavalerie disponible', availArc:'Archers disponibles',
    autoHint:'AUTO (après leader)',
    insuff:'Troupes insuffisantes !',
    missingInf:'Inf. manque ', missingCav:'Cav. manque ', missingArc:'Arc. manque ',
    reset:'↺ Réinitialiser tous les champs',
    roleLeader:'LEADER', roleJoiner:'JOINER',
    typeCol:'Type', totalCol:'Total',
    totalSquad:'TOTAL TEAM',
    sqLabel:'Esc.',
    totalRatio:'Total ratios :',
    empty:'Remplis les champs ci-dessus',
  },
  en: {
    subtitle:'Kingshot · Squad Composition',
    modeLeader:'⚔️ Leader Rallies', modeJoiner:'🛡️ Joiner Only',
    divLeader:'⚔️ Leader Configuration', divJoiner:'🛡️ Joiner Configuration',
    myTroops:'My Available Troops',
    totalInf:'Total Infantry', totalCav:'Total Cavalry', totalArc:'Total Archers',
    squadLeader:'Leader Squad', squadJoiner:'Joiner Squad',
    squadCap:'Squad Capacity',
    inf:'Infantry', cav:'Cavalry', arc:'Archers',
    normOk:'✓ Ratios normalized to 100%',
    squads:'Squads',
    resLeader:'Leader Results', resJoiner:'Joiner Results',
    remainLeader:'Remaining after Leader', remainJoiner:'Total remaining (unused)',
    availInf:'Available Infantry', availCav:'Available Cavalry', availArc:'Available Archers',
    autoHint:'AUTO (after leader)',
    insuff:'Insufficient troops!',
    missingInf:'Inf. missing ', missingCav:'Cav. missing ', missingArc:'Arc. missing ',
    reset:'↺ Reset all fields',
    roleLeader:'LEADER', roleJoiner:'JOINER',
    typeCol:'Type', totalCol:'Total',
    totalSquad:'TOTAL SQUAD',
    sqLabel:'Eq.',
    totalRatio:'Total ratios:',
    empty:'Fill in the fields above',
  },
  es: {
    subtitle:'Kingshot · Composición de Escuadras',
    modeLeader:'⚔️ Rallyes Líder', modeJoiner:'🛡️ Solo Joiner',
    divLeader:'⚔️ Configuración Líder', divJoiner:'🛡️ Configuración Joiner',
    myTroops:'Mis Tropas Disponibles',
    totalInf:'Infantería Total', totalCav:'Caballería Total', totalArc:'Arqueros Totales',
    squadLeader:'Escuadra Líder', squadJoiner:'Escuadra Joiner',
    squadCap:'Capacidad de la escuadra',
    inf:'Infantería', cav:'Caballería', arc:'Arqueros',
    normOk:'✓ Ratios normalizados al 100%',
    squads:'Escuadras',
    resLeader:'Resultados Líder', resJoiner:'Resultados Joiner',
    remainLeader:'Restante tras Líder', remainJoiner:'Restante total (sin usar)',
    availInf:'Infantería disponible', availCav:'Caballería disponible', availArc:'Arqueros disponibles',
    autoHint:'AUTO (tras líder)',
    insuff:'¡Tropas insuficientes!',
    missingInf:'Inf. faltan ', missingCav:'Cab. faltan ', missingArc:'Arc. faltan ',
    reset:'↺ Reiniciar todos los campos',
    roleLeader:'LÍDER', roleJoiner:'JOINER',
    typeCol:'Tipo', totalCol:'Total',
    totalSquad:'TOTAL EQUIPO',
    sqLabel:'Esc.',
    totalRatio:'Total ratios:',
    empty:'Rellena los campos de arriba',
  }
};

let lang = 'fr';
let currentMode = 'leader';
let jTeams = 1;

const fmt = n => Math.round(n).toLocaleString('fr-FR');
const t = () => T[lang];

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach((b,i) => b.classList.toggle('active', (i===0 && l==='fr')||(i===1 && l==='en')||(i===2 && l==='es')));
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (T[l][key] !== undefined) el.textContent = T[l][key];
  });
  // update norm hints
  ['l','j'].forEach(p => {
    const hint = document.getElementById(p+'-norm-hint');
    if (hint && hint.dataset.valid !== 'false') hint.textContent = t().normOk;
  });
  calcAll();
}

function setMode(mode) {
  currentMode = mode;
  const ls = document.getElementById('leader-section');
  const bl = document.getElementById('btn-mode-leader');
  const bj = document.getElementById('btn-mode-joiner');
  if (mode === 'leader') {
    ls.classList.remove('hidden');
    bl.className = 'mode-btn active-leader';
    bj.className = 'mode-btn';
  } else {
    ls.classList.add('hidden');
    bl.className = 'mode-btn';
    bj.className = 'mode-btn active-joiner';
  }
  calcAll();
}

function getVals(p) {
  return {
    inf: parseInt(document.getElementById(p+'-pct-inf').value)||0,
    cav: parseInt(document.getElementById(p+'-pct-cav').value)||0,
    arc: parseInt(document.getElementById(p+'-pct-arc').value)||0,
  };
}

function updateRatioBars(p, vals) {
  ['inf','cav','arc'].forEach(tp => {
    const bar = document.getElementById(p+'-bar-'+tp);
    if (bar) bar.style.width = Math.min(100, vals[tp])+'%';
  });
  const sum = vals.inf + vals.cav + vals.arc;
  const el = document.getElementById(p+'-ratio-val');
  const wrap = document.getElementById(p+'-ratio-total');
  if (el) {
    el.textContent = sum+'%';
    el.className = 'ratio-total-val ' + (sum===100 ? 'ok' : 'over');
    if (wrap) wrap.style.borderColor = sum===100 ? 'var(--success)' : 'var(--warn)';
  }
}

function onRatio(p) {
  const vals = getVals(p);
  updateRatioBars(p, vals);
  updateActivePreset(p, vals.inf, vals.cav, vals.arc);
  calcAll();
}

function setPreset(p, i, c, a) {
  ['inf','cav','arc'].forEach((tp,idx) => {
    document.getElementById(p+'-pct-'+tp).value = [i,c,a][idx];
  });
  updateRatioBars(p, {inf:i, cav:c, arc:a});
  updateActivePreset(p, i, c, a);
  calcAll();
}

function updateActivePreset(p, i, c, a) {
  const presets = [[10,30,60],[10,20,70],[10,10,80],[1,10,89]];
  const card = p==='l' ? document.querySelector('.card.leader') : document.querySelector('.card.joiner');
  card.querySelectorAll('.preset-btn').forEach((btn,idx) => {
    const pr = presets[idx];
    btn.classList.toggle('active', pr[0]===i && pr[1]===c && pr[2]===a);
  });
}

function changeTeams(delta) {
  jTeams = Math.max(1, Math.min(20, jTeams+delta));
  document.getElementById('j-teams-val').textContent = jTeams;
  calcAll();
}

function computeAndRender(pfx, cap, infA, cavA, arcA, vals, teams) {
  const thead = document.getElementById(pfx+'-thead');
  const tbody = document.getElementById(pfx+'-tbody');
  const tfoot = document.getElementById(pfx+'-tfoot');
  const sum = vals.inf+vals.cav+vals.arc;

  if (!cap || !sum || (!infA && !cavA && !arcA)) {
    thead.innerHTML = `<tr><th>${t().typeCol}</th><th class="col-total">${t().totalCol}</th></tr>`;
    tbody.innerHTML = `<tr><td colspan="2" style="text-align:center;color:var(--muted);padding:16px 0;font-size:.83rem;">${t().empty}</td></tr>`;
    tfoot.innerHTML = '';
    ['u-inf','u-cav','u-arc'].forEach(id => document.getElementById(pfx+'-'+id).textContent = '—');
    document.getElementById(pfx+'-warning-block').classList.remove('show');
    return {usedInf:0, usedCav:0, usedArc:0};
  }

  const rI=vals.inf/sum, rC=vals.cav/sum;
  const idealI=Math.round(cap*rI), idealC=Math.round(cap*rC), idealA=cap-idealI-idealC;

  let sqI=Math.min(idealI, Math.floor(infA/teams));
  let sqC=Math.min(idealC, Math.floor(cavA/teams));
  let sqA=Math.min(idealA, Math.floor(arcA/teams));

  // fill with archers first
  { const extra=Math.max(0,Math.floor((arcA-sqA*teams)/teams)); sqA+=Math.min(cap-sqI-sqC-sqA, extra); }
  // then inf+cav equally
  { let left=cap-sqI-sqC-sqA;
    if(left>0){
      const eI=Math.max(0,Math.floor((infA-sqI*teams)/teams));
      const eC=Math.max(0,Math.floor((cavA-sqC*teams)/teams));
      let bi=0,bc=0;
      while(left>0&&(eI-bi>0||eC-bc>0)){
        if(eI-bi>0&&left>0){bi++;left--;}
        if(eC-bc>0&&left>0){bc++;left--;}
      }
      sqI+=bi; sqC+=bc;
    }
  }

  const totI=sqI*teams, totC=sqC*teams, totA=sqA*teams, totU=totI+totC+totA;

  // thead
  let th=`<tr><th>${t().typeCol}</th>`;
  for(let i=0;i<teams;i++) th+=`<th>${t().sqLabel} ${i+1}</th>`;
  th+=`<th class="col-total">${t().totalCol}</th></tr>`;
  thead.innerHTML=th;

  const cell=(val,ideal,cls,isTot)=>{
    const ins=val<ideal;
    const c=[cls,ins?'insufficient':'',ins?'cell-warn':'',isTot?'col-total':''].filter(Boolean).join(' ');
    return `<td class="${c}">${fmt(val)}</td>`;
  };

  let rInf=`<tr><td><div class="type-cell"><span class="badge badge-inf"></span> ${t().inf}</div></td>`;
  for(let i=0;i<teams;i++) rInf+=cell(sqI,idealI,'val-inf',false);
  rInf+=cell(totI,idealI*teams,'val-inf',true)+'</tr>';

  let rCav=`<tr><td><div class="type-cell"><span class="badge badge-cav"></span> ${t().cav}</div></td>`;
  for(let i=0;i<teams;i++) rCav+=cell(sqC,idealC,'val-cav',false);
  rCav+=cell(totC,idealC*teams,'val-cav',true)+'</tr>';

  let rArc=`<tr><td><div class="type-cell"><span class="badge badge-arc"></span> ${t().arc}</div></td>`;
  for(let i=0;i<teams;i++) rArc+=cell(sqA,idealA,'val-arc',false);
  rArc+=cell(totA,idealA*teams,'val-arc',true)+'</tr>';

  tbody.innerHTML=rInf+rCav+rArc;

  let foot=`<tr><td>${t().totalSquad}</td>`;
  for(let i=0;i<teams;i++) foot+=`<td class="${(sqI+sqC+sqA)===cap?'':'insufficient'}">${fmt(sqI+sqC+sqA)}</td>`;
  foot+=`<td class="col-total">${fmt(totU)}</td></tr>`;
  tfoot.innerHTML=foot;

  // pool
  const setPool=(id,val)=>{
    const el=document.getElementById(id);
    el.textContent=val>=0?fmt(val):'−'+fmt(-val);
    el.style.color=val<0?'var(--warn)':'';
  };
  setPool(pfx+'-u-inf', infA-totI);
  setPool(pfx+'-u-cav', cavA-totC);
  setPool(pfx+'-u-arc', arcA-totA);

  // warnings
  const warns=[];
  if(infA>0&&totI<idealI*teams) warns.push(t().missingInf+fmt(idealI*teams-totI));
  if(cavA>0&&totC<idealC*teams) warns.push(t().missingCav+fmt(idealC*teams-totC));
  if(arcA>0&&totA<idealA*teams) warns.push(t().missingArc+fmt(idealA*teams-totA));
  const wb=document.getElementById(pfx+'-warning-block');
  document.getElementById(pfx+'-warning-msg').textContent=warns.join(' · ');
  wb.classList.toggle('show', warns.length>0);

  return {usedInf:totI, usedCav:totC, usedArc:totA};
}

function calcAll() {
  const infT=parseInt(document.getElementById('inf').value)||0;
  const cavT=parseInt(document.getElementById('cav').value)||0;
  const arcT=parseInt(document.getElementById('arc').value)||0;
  const capL=parseInt(document.getElementById('cap-l').value)||0;
  const capJ=parseInt(document.getElementById('cap-j').value)||0;

  let usedL={usedInf:0,usedCav:0,usedArc:0};
  if(currentMode==='leader') {
    usedL=computeAndRender('l', capL, infT, cavT, arcT, getVals('l'), 1);
  }

  const infR=Math.max(0,infT-usedL.usedInf);
  const cavR=Math.max(0,cavT-usedL.usedCav);
  const arcR=Math.max(0,arcT-usedL.usedArc);

  document.getElementById('j-inf-disp').value = infR||'';
  document.getElementById('j-cav-disp').value = cavR||'';
  document.getElementById('j-arc-disp').value = arcR||'';

  computeAndRender('j', capJ, infR, cavR, arcR, getVals('j'), jTeams);
}

function resetAll() {
  ['inf','cav','arc','cap-l','cap-j'].forEach(id=>document.getElementById(id).value='');
  ['j-inf-disp','j-cav-disp','j-arc-disp'].forEach(id=>document.getElementById(id).value='');
  jTeams=1; document.getElementById('j-teams-val').textContent='1';
  setPreset('l',10,10,80); setPreset('j',10,10,80);
  setMode('leader');
}

// ── LocalStorage save/load ──
const SAVE_KEY = 'kingshot-bear-calc';

function saveData() {
  const data = {
    inf: document.getElementById('inf').value,
    cav: document.getElementById('cav').value,
    arc: document.getElementById('arc').value,
    capL: document.getElementById('cap-l').value,
    capJ: document.getElementById('cap-j').value,
    pctLInf: document.getElementById('l-pct-inf').value,
    pctLCav: document.getElementById('l-pct-cav').value,
    pctLArc: document.getElementById('l-pct-arc').value,
    pctJInf: document.getElementById('j-pct-inf').value,
    pctJCav: document.getElementById('j-pct-cav').value,
    pctJArc: document.getElementById('j-pct-arc').value,
    jTeams: jTeams,
    mode: currentMode,
    lang: lang,
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch(e) {}
}

function loadData() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.inf)    document.getElementById('inf').value    = d.inf;
    if (d.cav)    document.getElementById('cav').value    = d.cav;
    if (d.arc)    document.getElementById('arc').value    = d.arc;
    if (d.capL)   document.getElementById('cap-l').value  = d.capL;
    if (d.capJ)   document.getElementById('cap-j').value  = d.capJ;
    if (d.pctLInf) document.getElementById('l-pct-inf').value = d.pctLInf;
    if (d.pctLCav) document.getElementById('l-pct-cav').value = d.pctLCav;
    if (d.pctLArc) document.getElementById('l-pct-arc').value = d.pctLArc;
    if (d.pctJInf) document.getElementById('j-pct-inf').value = d.pctJInf;
    if (d.pctJCav) document.getElementById('j-pct-cav').value = d.pctJCav;
    if (d.pctJArc) document.getElementById('j-pct-arc').value = d.pctJArc;
    if (d.jTeams)  { jTeams = parseInt(d.jTeams); document.getElementById('j-teams-val').textContent = jTeams; }
    // update ratio bars
    updateRatioBars('l', { inf: parseInt(d.pctLInf)||10, cav: parseInt(d.pctLCav)||10, arc: parseInt(d.pctLArc)||80 });
    updateRatioBars('j', { inf: parseInt(d.pctJInf)||10, cav: parseInt(d.pctJCav)||10, arc: parseInt(d.pctJArc)||80 });
    updateActivePreset('l', parseInt(d.pctLInf)||10, parseInt(d.pctLCav)||10, parseInt(d.pctLArc)||80);
    updateActivePreset('j', parseInt(d.pctJInf)||10, parseInt(d.pctJCav)||10, parseInt(d.pctJArc)||80);
    if (d.lang)   setLang(d.lang);
    if (d.mode)   setMode(d.mode);
  } catch(e) {}
}

// Patch calcAll to auto-save on every change
const _calcAll = calcAll;
calcAll = function() { _calcAll(); saveData(); };

// Patch resetAll to also clear localStorage
const _resetAll = resetAll;
resetAll = function() { _resetAll(); try { localStorage.removeItem(SAVE_KEY); } catch(e) {} };

// Init
setLang('fr');
setPreset('l',10,10,80);
setPreset('j',10,10,80);
loadData();
calcAll();
</script>
